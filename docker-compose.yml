services:
  # Servidor de Base de Datos
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 12345
      MYSQL_DATABASE: agronomia_db
    ports:
      - "7300:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # Administrador de Base de Datos
  phpmyadmin:
    image: phpmyadmin:latest
    restart: always
    ports:
      - "7301:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: 12345
    volumes:
      - db:/var/lib/mysql
      - phpmyadmin_data:/var/www/html
    depends_on:
      - db

  # Frontend en Angular
  frontend:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "7302:4200"
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm install && npx ng serve --host 0.0.0.0 --allowed-hosts An_ProyectoAgronomia_G5"
    depends_on:
      - db

volumes:
  mysql_data:
  phpmyadmin_data:
  db:
  frontend:
  node_modules: