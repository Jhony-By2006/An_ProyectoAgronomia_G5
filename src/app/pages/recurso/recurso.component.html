<div class="contenedor-seccion" style="padding: 20px;">
    <h1 class="titulo recurso-header">Lista de Recursos Agrícolas</h1>

    <table mat-table [dataSource]="$dataSource()" class="mat-elevation-z8" style="width: 100%;">

      <ng-container matColumnDef="idRecurso">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let element"> {{element.idRecurso}} </td>
      </ng-container>

      <ng-container matColumnDef="nombreRecurso">
        <th mat-header-cell *matHeaderCellDef> Nombre </th>
        <td mat-cell *matCellDef="let element"> {{element.nombreRecurso}} </td>
      </ng-container>

      <ng-container matColumnDef="tipoRecurso">
        <th mat-header-cell *matHeaderCellDef> Tipo </th>
        <td mat-cell *matCellDef="let element"> {{element.tipoRecurso}} </td>
      </ng-container>

      <ng-container matColumnDef="cantidadRecurso">
        <th mat-header-cell *matHeaderCellDef> Cantidad </th>
        <td mat-cell *matCellDef="let element"> {{element.cantidadRecurso}} {{element.unidadMedidaRecurso}} </td>
      </ng-container>

      <ng-container matColumnDef="costoRecurso">
        <th mat-header-cell *matHeaderCellDef> Costo </th>
        <td mat-cell *matCellDef="let element"> S/ {{element.costoRecurso}} </td>
      </ng-container>

      <ng-container matColumnDef="estadoRecurso">
        <th mat-header-cell *matHeaderCellDef> Estado </th>
        <td mat-cell *matCellDef="let element"> {{element.estadoRecurso ? 'Activo' : 'Inactivo'}} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
</div>
