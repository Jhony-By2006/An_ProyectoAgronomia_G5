<h2 mat-dialog-title class="dialog-title">
  Detalle del Reporte
</h2>

<mat-dialog-content class="dialog-content">

  <div class="info-grid">

    <div class="info-item">
      <strong>ID:</strong>
      <span>{{ reporte.idReporte }}</span>
    </div>

    <div class="info-item">
      <strong>Título:</strong>
      <span>{{ reporte.titulo }}</span>
    </div>

    <div class="info-item">
      <strong>Tipo:</strong>
      <span>{{ reporte.tipoReporte }}</span>
    </div>

    <div class="info-item">
      <strong>Fecha:</strong>
      <span>{{ reporte.fechaGeneracion }}</span>
    </div>

    <div class="info-item">
      <strong>Generado Por:</strong>
      <span>{{ reporte.generadoPor }}</span>
    </div>

    <div class="info-item">
      <strong>Estado:</strong>
      <span>
        {{ reporte.estadoReporte ? 'Activo' : 'Inactivo' }}
      </span>
    </div>

  </div>

  <div class="contenido-box">

    <strong>Contenido:</strong>

    <textarea readonly rows="10">
{{ reporte.contenido }}
    </textarea>

  </div>

</mat-dialog-content>

<mat-dialog-actions align="end">

  <button mat-flat-button class="btn-close" (click)="close()">

    Cerrar

  </button>

</mat-dialog-actions>
