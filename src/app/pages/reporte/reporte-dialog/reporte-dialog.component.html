<div class="form-page">
  <h2 class="form-title">Gestión de Reportes</h2>
  <div class="form-card">
    <div class="form-grid">

      <mat-form-field appearance="outline" class="field-span2">
        <mat-label>Título</mat-label>
        <input matInput placeholder="Ej. Reporte mensual de ventas" [(ngModel)]="$reporte().titulo">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Tipo de Reporte</mat-label>
        <input matInput placeholder="Ej. Ventas" [(ngModel)]="$reporte().tipoReporte">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Fecha de Generación</mat-label>
        <input matInput type="date" [(ngModel)]="$reporte().fechaGeneracion">
      </mat-form-field>

      <mat-form-field appearance="outline" class="field-span2">
        <mat-label>Contenido</mat-label>
        <textarea matInput rows="4" placeholder="Descripción del contenido del reporte"
          [(ngModel)]="$reporte().contenido">
        </textarea>
      </mat-form-field>

      <mat-form-field appearance="outline" class="field-span2">
        <mat-label>Generado por</mat-label>
        <input matInput placeholder="Ej. Admin" [(ngModel)]="$reporte().generadoPor">
      </mat-form-field>

      <mat-form-field appearance="outline" class="field-span2">
        <mat-label>Estado</mat-label>
        <mat-select [(ngModel)]="$reporte().estadoReporte">
          <mat-option [value]="true">Activo</mat-option>
          <mat-option [value]="false">Inactivo</mat-option>
        </mat-select>
      </mat-form-field>

    </div>
    <div class="form-actions">
      <button mat-flat-button type="button" class="btn-cancel" (click)="close()">
        <mat-icon>cancel</mat-icon>
        <span>Cancelar</span>
      </button>
      <button mat-flat-button type="button" class="btn-submit" (click)="operate()">
        <mat-icon>done</mat-icon>
        <span>Guardar</span>
      </button>
    </div>
  </div>
</div>
