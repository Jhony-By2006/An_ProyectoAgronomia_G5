<div class="page-header">
  <h2 class="page-title">Reportes</h2>
  <button mat-flat-button class="btn-registrar" (click)="openDialog()">
    <mat-icon>add</mat-icon> Registrar Reporte
  </button>
</div>

<mat-form-field class="search-field" appearance="outline">
  <mat-label>Buscar Reporte</mat-label>
  <mat-icon matPrefix>search</mat-icon>
  <input matInput (keyup)="applyFilter($event)" placeholder="Ej. Reporte mensual" #input>
</mat-form-field>

<div class="table-card">
  <table mat-table [dataSource]="$dataSource()" matSort>

    <ng-container matColumnDef="idReporte">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
      <td mat-cell *matCellDef="let row"> {{ row.idReporte }} </td>
    </ng-container>

    <ng-container matColumnDef="titulo">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Título </th>
      <td mat-cell *matCellDef="let row"> {{ row.titulo }} </td>
    </ng-container>

    <ng-container matColumnDef="tipoReporte">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Tipo </th>
      <td mat-cell *matCellDef="let row"> {{ row.tipoReporte }} </td>
    </ng-container>

    <ng-container matColumnDef="fechaGeneracion">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Fecha </th>
      <td mat-cell *matCellDef="let row"> {{ row.fechaGeneracion | date:'dd/MM/yyyy' }} </td>
    </ng-container>

    <ng-container matColumnDef="generadoPor">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Generado por </th>
      <td mat-cell *matCellDef="let row"> {{ row.generadoPor }} </td>
    </ng-container>

    <ng-container matColumnDef="estadoReporte">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Estado </th>
      <td mat-cell *matCellDef="let row">
        <span [class]="row.estadoReporte ? 'badge badge-active' : 'badge badge-inactive'">
          {{ row.estadoReporte ? 'Activo' : 'Inactivo' }}
        </span>
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Acciones </th>
      <td mat-cell *matCellDef="let row">
        <button mat-icon-button class="btn-edit" (click)="openDialog(row)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button class="btn-delete" (click)="delete(row.idReporte)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell no-data" colspan="7">
        No hay resultados para "{{ input.value }}"
      </td>
    </tr>
  </table>
  <mat-paginator [pageSizeOptions]="[5, 10, 25]" aria-label="Seleccionar página"></mat-paginator>
</div>
