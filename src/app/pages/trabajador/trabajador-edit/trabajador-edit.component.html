<h2 mat-dialog-title>{{ data ? 'Detalles del Trabajador' : 'Nuevo Trabajador' }}</h2>

<mat-dialog-content [formGroup]="form" style="display: flex; flex-direction: column; gap: 12px; padding-top: 8px;">
  
  <mat-form-field appearance="outline">
    <mat-label>Nombre</mat-label>
    <input matInput formControlName="nombreTrabajador" placeholder="Ej. Juan">
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Apellidos</mat-label>
    <input matInput formControlName="apellidosTrabajador" placeholder="Ej. Pérez">
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>DNI / Documento</mat-label>
    <input matInput formControlName="dni" placeholder="Ej. 75849302">
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Cargo</mat-label>
    <input matInput formControlName="cargo" placeholder="Ej. Supervisor, Operario">
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Teléfono</mat-label>
    <input matInput formControlName="telefono" placeholder="Ej. 930875930">
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Email</mat-label>
    <input matInput type="email" formControlName="email" placeholder="correo@ejemplo.com">
  </mat-form-field>

<mat-form-field appearance="outline">
    <mat-label>Fecha de Contrato</mat-label>
    <input matInput type="date" formControlName="fechaContratoT">
  </mat-form-field>

  <mat-checkbox formControlName="estado" color="primary">Trabajador Activo</mat-checkbox>

</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancelar()">Cancelar</button>
  <button mat-flat-button style="background-color: #2e694e; color: white;" [disabled]="form.invalid" (click)="guardar()">OK</button>
</mat-dialog-actions>
