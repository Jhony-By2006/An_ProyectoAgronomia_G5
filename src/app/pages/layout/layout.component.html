<div class="example-container">
  <mat-toolbar color="primary">
    <button mat-icon-button (click)="sidenav.toggle()">
      <mat-icon>menu</mat-icon>
    </button>
    <span>RENTAPP</span>
    <span class="example-spacer"></span>
  </mat-toolbar>

  <mat-sidenav-container class="example-sidenav-container">
    <mat-sidenav #sidenav mode="push" style="width: 250px">
      <div class="nav-section-label">Menú</div>
      <mat-divider></mat-divider>

      <button mat-menu-item routerLink="/pages/recurso" routerLinkActive="active" (click)="sidenav.toggle()">
        <mat-icon>inventory_2</mat-icon>
        <span>Recursos</span>
      </button>
      <button mat-menu-item routerLink="/pages/proveedor" routerLinkActive="active" (click)="sidenav.toggle()">
        <mat-icon>people</mat-icon>
        <span>Proveedores</span>
      </button>
      <mat-divider></mat-divider>
    </mat-sidenav>

    <mat-sidenav-content>
      <router-outlet></router-outlet>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
