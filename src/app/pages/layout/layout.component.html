<div class="example-container">

  <mat-toolbar color="primary" class="app-toolbar">
    <button mat-icon-button (click)="sidenav.toggle()" class="menu-toggle">
      <mat-icon>menu</mat-icon>
    </button>

    <img src="Logo Proyecto Agronomia.png" alt="Logo" class="brand-logo">

    <span class="example-spacer"></span>
  </mat-toolbar>

  <mat-sidenav-container class="example-sidenav-container">

    <mat-sidenav
      #sidenav
      [mode]="isMobile ? 'over' : 'side'"
      [opened]="!isMobile"
      class="app-sidenav">

      <mat-divider class="nav-divider"></mat-divider>

      <div class="nav-section-label">Gestión</div>

      @if (isAdmin) {
        <button mat-menu-item routerLink="/pages/administracion" routerLinkActive="active" (click)="closeSidenavOnMobile(sidenav)">
          <mat-icon>settings</mat-icon>
          <span>Administración</span>
        </button>
      }

      <button mat-menu-item routerLink="/pages/inventario" routerLinkActive="active" (click)="closeSidenavOnMobile(sidenav)">
        <mat-icon>inventory_2</mat-icon>
        <span>Inventario</span>
      </button>

      <button mat-menu-item routerLink="/pages/metodo-pago" routerLinkActive="active" (click)="closeSidenavOnMobile(sidenav)">
        <mat-icon>credit_card</mat-icon>
        <span>Métodos de Pago</span>
      </button>

      <button mat-menu-item routerLink="/pages/pago" routerLinkActive="active" (click)="closeSidenavOnMobile(sidenav)">
        <mat-icon>credit_card</mat-icon>
        <span>Pagos</span>
      </button>

      <button mat-menu-item routerLink="/pages/producto-final" routerLinkActive="active" (click)="closeSidenavOnMobile(sidenav)">
        <mat-icon>inventory</mat-icon>
        <span>Productos Finales</span>
      </button>

      <button mat-menu-item routerLink="/pages/producto-inicial" routerLinkActive="active" (click)="closeSidenavOnMobile(sidenav)">
        <mat-icon>inventory</mat-icon>
        <span>Productos Iniciales</span>
      </button>

      <button mat-menu-item routerLink="/pages/proveedor" routerLinkActive="active" (click)="closeSidenavOnMobile(sidenav)">
        <mat-icon>people</mat-icon>
        <span>Proveedores</span>
      </button>

      <button mat-menu-item routerLink="/pages/recurso" routerLinkActive="active" (click)="closeSidenavOnMobile(sidenav)">
        <mat-icon>layers</mat-icon>
        <span>Recursos</span>
      </button>

      @if (isAdmin) {
        <button mat-menu-item routerLink="/pages/recurso-administracion" routerLinkActive="active" (click)="closeSidenavOnMobile(sidenav)">
          <mat-icon>settings</mat-icon>
          <span>Recursos Admin</span>
        </button>
      }

      <button mat-menu-item routerLink="/pages/reporte" routerLinkActive="active" (click)="closeSidenavOnMobile(sidenav)">
        <mat-icon>bar_chart</mat-icon>
        <span>Reportes</span>
      </button>

      @if (isAdmin) {
        <button mat-menu-item routerLink="/pages/trabajador" routerLinkActive="active" (click)="closeSidenavOnMobile(sidenav)">
          <mat-icon>people</mat-icon>
          <span>Trabajadores</span>
        </button>
      }

      <mat-divider class="nav-divider"></mat-divider>

      <button mat-menu-item class="btn-logout" (click)="logout()">
        <mat-icon>exit_to_app</mat-icon>
        <span>Cerrar sesión</span>
      </button>

    </mat-sidenav>

    <mat-sidenav-content>
      <router-outlet></router-outlet>
    </mat-sidenav-content>

  </mat-sidenav-container>

</div>
