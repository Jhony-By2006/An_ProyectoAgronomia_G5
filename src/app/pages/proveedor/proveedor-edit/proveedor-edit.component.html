<div class="form-page">
  <h2 class="form-title">Gestión de Proveedores</h2>

  <form [formGroup]="$form()" (submit)="operate()"
        class="form-card" #frmProveedor="ngForm">

    <div [hidden]="true">
      <mat-form-field>
        <mat-label>ID</mat-label>
        <input matInput placeholder="ID" formControlName="idProveedor">
      </mat-form-field>
    </div>

    <div class="form-grid">

      <mat-form-field appearance="outline">
        <mat-label>Nombre</mat-label>
        <input matInput placeholder="Nombre" formControlName="nombreProveedor">
        @if ($f()['nombreProveedor'].errors?.['required'] && $f()['nombreProveedor'].touched) {
          <small class="invalid">Es requerido</small>
        }
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Apellido</mat-label>
        <input matInput placeholder="Apellido" formControlName="apellidoProveedor">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>RUC</mat-label>
        <input matInput placeholder="RUC" formControlName="rucProveedor">
        @if ($f()['rucProveedor'].errors?.['required'] && $f()['rucProveedor'].touched) {
          <small class="invalid">Es requerido</small>
        }
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Teléfono</mat-label>
        <input matInput placeholder="Teléfono" formControlName="telefonoProveedor">
      </mat-form-field>

      <mat-form-field appearance="outline" class="field-span2">
        <mat-label>Dirección</mat-label>
        <input matInput placeholder="Dirección" formControlName="direccionProveedor">
      </mat-form-field>

      <mat-form-field appearance="outline" class="field-span2">
        <mat-label>Email</mat-label>
        <input matInput placeholder="Email" formControlName="emailProveedor">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Estado</mat-label>
        <input matInput placeholder="Estado" formControlName="estadoProveedor">
      </mat-form-field>

    </div>

    <div class="form-actions">
      <button mat-flat-button type="button"
              class="btn-cancel" routerLink="/pages/proveedor">
        <mat-icon>cancel</mat-icon>
        <span>Cancelar</span>
      </button>
      <button mat-flat-button type="submit"
              class="btn-submit" [disabled]="frmProveedor.invalid">
        <mat-icon>done</mat-icon>
        <span>Guardar</span>
      </button>
    </div>

  </form>
</div>
