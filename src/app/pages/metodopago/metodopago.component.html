<div class="page-header">
  <h2 class="page-title">Métodos de Pago</h2>
  <button mat-flat-button class="btn-registrar" (click)="openDialog()">
    <mat-icon>add</mat-icon> Registrar Método
  </button>
</div>

<mat-form-field class="search-field" appearance="outline">
  <mat-label>Buscar Método de Pago</mat-label>
  <mat-icon matPrefix>search</mat-icon>
  <input matInput (keyup)="applyFilter($event)" placeholder="Ej. Efectivo" #input>
</mat-form-field>

<div class="table-card">
  <table mat-table [dataSource]="$dataSource()" matSort>

    <ng-container matColumnDef="idMetodoPago">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
      <td mat-cell *matCellDef="let row"> {{ row.idMetodoPago }} </td>
    </ng-container>

    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Nombre </th>
      <td mat-cell *matCellDef="let row"> {{ row.nombre }} </td>
    </ng-container>

    <ng-container matColumnDef="descripcion">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Descripción </th>
      <td mat-cell *matCellDef="let row"> {{ row.descripcion }} </td>
    </ng-container>

    <ng-container matColumnDef="estadoMetodoPago">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Estado </th>
      <td mat-cell *matCellDef="let row">
        <span [class]="row.estadoMetodoPago ? 'badge badge-active' : 'badge badge-inactive'">
          {{ row.estadoMetodoPago ? 'Activo' : 'Inactivo' }}
        </span>
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Acciones </th>
      <td mat-cell *matCellDef="let row">
        <button mat-icon-button class="btn-edit" (click)="openDialog(row)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button class="btn-delete" (click)="delete(row.idMetodoPago)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell no-data" colspan="5">
        No hay resultados para "{{ input.value }}"
      </td>
    </tr>

  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 25]" aria-label="Seleccionar página"></mat-paginator>
</div>
